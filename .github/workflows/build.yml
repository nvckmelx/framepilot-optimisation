name: app
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['web/**']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with the installer under this tag (e.g. v1.0.0). Leave empty to only build."
        required: false
        default: ""
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore FramePilot.slnx
      - name: Build
        run: dotnet build FramePilot.slnx -c Release --no-restore
      - name: Test
        run: dotnet test FramePilot.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"
      - name: Download PresentMon (Intel, MIT)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force pm | Out-Null
          gh release download v2.6.0 --repo GameTechDev/PresentMon --pattern "PresentMon-2.6.0-x64.exe" --dir pm
          Invoke-WebRequest https://raw.githubusercontent.com/GameTechDev/PresentMon/v2.6.0/LICENSE.txt -OutFile pm/LICENSE.txt
          Get-ChildItem pm
      - name: Publish
        shell: pwsh
        run: ./build/publish.ps1 -SkipTests -PresentMon pm/PresentMon-2.6.0-x64.exe -PresentMonLicense pm/LICENSE.txt
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DSourceDir=$PWD\artifacts\FramePilot" "/DOutputDir=$PWD\artifacts" installer\FramePilot.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The 1.0.x download link (and the website before 1.1) points to the old file name: publish both.
          Copy-Item artifacts/TuneFPS-Setup-x64.exe artifacts/FramePilot-Setup-x64.exe
      - name: UI smoke test (design preview, every section rendered to PNG)
        shell: pwsh
        run: |
          $shots = Join-Path $PWD "artifacts\screens"
          $p = Start-Process artifacts/FramePilot/FramePilot.exe -ArgumentList "--design-preview","--lang","ru","--screenshots","`"$shots`"" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "UI tour timed out" }
          $log = Join-Path $env:LOCALAPPDATA "FramePilot\design-preview\logs"
          if (Test-Path $log) { Get-ChildItem $log -File | ForEach-Object { Write-Host "== $($_.Name)"; Get-Content $_.FullName } }
          if ($p.ExitCode -ne 0) { throw "UI tour failed with exit code $($p.ExitCode)" }
          $n = @(Get-ChildItem $shots -Filter *.png).Count
          if ($n -lt 6) { throw "Expected 6 screenshots, got $n" }
          if ((Test-Path $log) -and (Select-String -Path (Join-Path $log "*") -Pattern "Exception" -Quiet)) { throw "Exceptions in the app log" }
      - uses: actions/upload-artifact@v4
        with:
          name: TuneFPS
          path: |
            artifacts/FramePilot
            artifacts/TuneFPS-Setup-x64.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: TuneFPS ${{ inputs.release_tag || github.ref_name }}
          files: |
            artifacts/TuneFPS-Setup-x64.exe
            artifacts/FramePilot-Setup-x64.exe
          body_path: docs/releases/${{ inputs.release_tag || github.ref_name }}.md
          generate_release_notes: true
      - name: Publish UI screenshots to the ci-screenshots branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = Join-Path $env:RUNNER_TEMP "shots-repo"
          git init -q $repo
          Copy-Item artifacts/screens/*.png $repo
          Set-Location $repo
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add *.png
          git commit -q -m "UI screenshots for $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" HEAD:ci-screenshots
